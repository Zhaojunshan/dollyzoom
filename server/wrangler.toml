name = "dollyzoom-moderation"
main = "worker.mjs"
compatibility_date = "2024-11-01"

# Secrets, not vars. Create the API key in Creem Dashboard → Developers → API Keys.
# The live key prefix is creem_ (not creem_test_).
#   npx wrangler secret put CREEM_API_KEY
#   npx wrangler secret put CREEM_WEBHOOK_SECRET
#   npx wrangler secret put CREEM_SESSION_SECRET
#   npx wrangler secret put MINIMAX_API_KEY
#
# CREEM_WEBHOOK_SECRET is the signing secret from Developers → Webhooks.
# CREEM_SESSION_SECRET is a random string of at least 16 characters
# (for example `openssl rand -hex 32`). It only signs browser sessions.
# MINIMAX_API_KEY is the MiniMax pay-as-you-go key from
# Account Management → API Keys. Paid HD uses it for Hailuo / H3
# image-to-video. Leave it as a secret. Do not copy it into [vars].

[vars]
GENERATION_CREDIT_COST = "1"
