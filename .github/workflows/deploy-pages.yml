name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # https://dollyzoom.top is served at the site root (no /dollyzoom prefix).
          # Relative asset URLs also resolve on the github.io project path.
          NEXT_PUBLIC_RELATIVE_ASSETS: "1"

      - name: Ensure Pages CNAME
        # Actions publishing ignores this file and keeps the domain configured
        # in Pages settings. It is still written into the artifact so a deploy
        # cannot drop the domain name, and so a branch-based publish would
        # keep dollyzoom.top.
        run: printf '%s\n' 'dollyzoom.top' > out/CNAME

      - name: Relativize favicon and nested assets
        # Favicon and ./_next URLs are relative to each HTML file so nested
        # routes (terms, privacy, acceptable-use) still load CSS and JS at
        # the domain root and on a github.io project path.
        run: python3 scripts/relativize-pages-export.py

      - name: Test moderation proxy
        run: npm test

      - name: Assert root-path export
        run: |
          if grep -q '/dollyzoom/_next' out/index.html; then
            echo "Export still prefixes assets with /dollyzoom" >&2
            exit 1
          fi
          if grep -q 'href="/favicon.ico' out/index.html; then
            echo "Favicon link is still absolute" >&2
            exit 1
          fi
          grep -qx 'dollyzoom.top' out/CNAME
          grep -q 'https://www.creem.io/payment/prod_w9pGaP1bfoaF20iNiGXKt' out/index.html
          grep -q 'Zjs315416174@gmail.com' out/index.html
          grep -q '/demo/dolly-zoom.mp4' out/index.html
          test -f out/terms/index.html
          test -f out/privacy/index.html
          test -f out/acceptable-use/index.html
          test -f out/demo/before.jpg
          test -f out/demo/dolly-zoom.mp4
          if grep -R -n -E 'Sample clip TBD|CREEM_API_KEY|creem_test_|x-api-key' out \
            --include='*.html' --include='*.js' --include='*.json'; then
            echo "Pages bundle contains a placeholder or secret-like string" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
